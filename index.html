<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Registration Portal</title>
    <meta name="description" content="A comprehensive student enrollment and administration system featuring profile management, document registration, status verification, and admin request approval." />
    <meta property="og:title" content="University Registration Portal" />
    <meta property="og:description" content="A comprehensive student enrollment and administration system featuring profile management, document registration, status verification, and admin request approval." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchStore = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchStore;
            },
            set: function(val) {
              fetchStore = val;
            }
          });
        } catch (e) {
          console.warn('Global fetch setter safeguard failed to initialize:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frontend/main.jsx"></script>
  </body>
</html>
